name: Test & Deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  # Allows you to run this workflow manually from the Actions tab
  # https://docs.github.com/en/actions/managing-workflow-runs/manually-running-a-workflow
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

    - name: ☑️ Checkout code
      uses: actions/checkout@v7
      # Need all commits to track info
      with:
        fetch-depth: 0

    - name: 💎 Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
        working-directory: ./docs

    - name: 🧪 Install gems
      run: |
        cd ./docs
        bundle install

    - name: 🔧 Build & Test
      env:
        TZ: 'Asia/Tokyo'
      run: |
        cd ./docs
        JEKYLL_ENV=production bundle exec jekyll build
        bundle exec rake upsert_data_by_readme
        bundle exec rake test

  # Deploy job is triggered only pushed to main branch && CI passed
  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    steps:

    - name: ☑️ Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: 💎 Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
        working-directory: ./docs

    - name: 🧪 Install gems
      run: |
        cd ./docs
        bundle install

    - name: 📝 Extract PR number from last commit
      run: |
        COMMIT_MESSAGE=$(git show -s --format=%s HEAD)
        PR_NUMBER=$(echo "$COMMIT_MESSAGE" | sed -nE 's/^Merge pull request #([0-9]+).*/\1/p')

        if [ -n "$PR_NUMBER" ]; then
          echo "PR_NUMBER=#$PR_NUMBER" >> $GITHUB_ENV; else
          echo "PR_NUMBER="            >> $GITHUB_ENV
        fi

    - name: 🤖 Generate page(s) by README
      env:
        TZ: 'Asia/Tokyo'
        PR_NUMBER: ${{ env.PR_NUMBER }}
      run: |
        cd ./docs
        bundle exec rake upsert_data_by_readme
        if [ -n "$(git status en ja --porcelain)" ]; then
          git config --global user.name  "Yohei Yasukawa"
          git config --global user.email "yohei@yasslab.jp"
          git checkout main
          git add en ja
          git commit -m "🤖 Generate page(s) by README $PR_NUMBER"
          git push origin main
        fi

    - name: 🔧 Build all pages
      env:
        TZ: 'Asia/Tokyo'
      run: |
        cd ./docs
        JEKYLL_ENV=production bundle exec jekyll build

    # 公式の Pages の action で配る。以前は第三者の peaceiris/actions-gh-pages に書き込みのトークンを渡し、
    # gh-pages ブランチへ push していた。ここではビルドした _site を成果物として上げ、下の pages ジョブが配る
    - name: 📦 Upload site for GitHub Pages
      uses: actions/upload-pages-artifact@v5.0.0
      with:
        path: ./docs/_site

  pages:
    name: 🚀 Deploy to GitHub Pages
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pages:    write  # Pages に配る
      id-token: write  # 配布元がこの workflow であることを確かめる
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}
    steps:
    - id:   deployment
      uses: actions/deploy-pages@v5.0.1
